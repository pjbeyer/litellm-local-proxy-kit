# Personal deployment overlay — VALUES ONLY (spec 015, Contract 2).
# Source of truth for the rendered config; secrets appear as env-var NAMES only.
# Bootstrap scaffold (2026-11-16): layout complete, wiring deferred.
#
# KNOWN FIDELITY GAP vs the frozen legacy config (deployments/personal/
# proxy_config.yaml): core/render_config.py supports only
# router_settings.fallbacks — the legacy config's rich router block
# (routing_strategy simple-shuffle, enable_pre_call_checks, num_retries 0,
# max_fallbacks 12, allowed_fails 0, cooldown_time 5, empty context-window/
# content-policy fallbacks) is NOT rendered today. Until the renderer gains
# that capability (follow-up required before the first live apply), a render
# from this overlay is NOT behaviorally equivalent to the legacy config.
# Recorded as a bootstrap limitation; do not apply without resolving it.
#
# mcp_servers is deliberately EMPTY (valid explicit state, spec 003 US6):
# the personal deployment aggregates no MCP servers today. When the first
# personal server is added, it goes through the mcp-aggregator-maintenance
# lifecycle (spec 003) — never a hand-edit of this file's rendered output.

# Renderer-mandatory shape: the personal deployment has NO single upstream
# (it is local oMLX + ordered free-tier cloud providers). All real model
# entries ride extra_model_list below; this block emits nothing because
# models is empty and wildcard is absent.
upstream:
  api_base: http://127.0.0.1:8000/v1
  api_key_env: LOCAL_OMLX_API_KEY
  models: []

master_key_env: LITELLM_PERSONAL_KEY

# WIRING-STAGE NOTE (not a runtime_environment block): the personal deployment
# has no MCP stdio servers yet and no DATABASE_URL decision — both are wiring
# items. CLOUDFLARE_API_BASE is declared in credentials.toml (owner-action
# pending); its runtime derivation from CLOUDFLARE_ACCOUNT_ID via proxy-env.sh
# must be reconciled at wiring time (pick one home, not both).

extra_model_list:
  # Local oMLX (SIMPLE/MEDIUM tier target of the auto-free router).
  - model_name: local
    litellm_params:
      model: openai/gemma-4-12b-coder-fable5-composer2.5-4bit
      api_base: http://127.0.0.1:8000/v1
      api_key: os.environ/LOCAL_OMLX_API_KEY
      temperature: 0.7
      top_p: 0.95
      max_tokens: 8192
      timeout: 180
      num_retries: 0
      max_parallel_requests: 1
    model_info:
      id: omlx-local
      # No invented context limit: confirm the actual loaded oMLX model.

  # Ordered free-tier cloud providers (COMPLEX/REASONING tiers). All share
  # model_name cloud-free; order = preference + failover.
  - model_name: cloud-free
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 1
      rpm: 5
      tpm: 250000
      max_parallel_requests: 1
      max_tokens: 16384
      timeout: 180
      num_retries: 0
    model_info:
      id: gemini-38-free
      max_input_tokens: 200000

  - model_name: cloud-free
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 2
      rpm: 5
      tpm: 250000
      max_parallel_requests: 1
      max_tokens: 16384
      timeout: 180
      num_retries: 0
    model_info:
      id: gemini-37-free
      max_input_tokens: 200000

  - model_name: cloud-free
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 3
      rpm: 5
      tpm: 250000
      max_parallel_requests: 1
      max_tokens: 16384
      timeout: 180
      num_retries: 0
    model_info:
      id: gemini-36-free
      max_input_tokens: 200000

  - model_name: cloud-free
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 4
      rpm: 5
      tpm: 250000
      max_parallel_requests: 1
      max_tokens: 16384
      timeout: 180
      num_retries: 0
    model_info:
      id: gemini-35-free
      max_input_tokens: 200000

  - model_name: cloud-free
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      order: 5
      rpm: 20
      max_parallel_requests: 2
      max_tokens: 16384
      timeout: 180
      num_retries: 0
      # Callback also reapplies these controls on every attempt.
      extra_body:
        provider:
          require_parameters: true
          max_price:
            prompt: 0
            completion: 0
            request: 0
    model_info:
      id: openrouter-free
      # Dynamic free router has no guaranteed fixed context size.

  - model_name: cloud-free
    litellm_params:
      # Use explicit OpenAI-compatible endpoint, not the legacy /ai/run adapter.
      model: openai/@cf/openai/gpt-oss-120b
      api_key: os.environ/CLOUDFLARE_API_KEY
      api_base: os.environ/CLOUDFLARE_API_BASE
      order: 6
      max_parallel_requests: 2
      max_tokens: 16384
      timeout: 180
      num_retries: 0
    model_info:
      id: cloudflare-oss120-free
      max_input_tokens: 110000

  - model_name: cloud-free
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      order: 7
      rpm: 30
      # 8K TPM checked in the callback after its 4K output cap is applied.
      max_parallel_requests: 1
      max_tokens: 4096
      timeout: 90
      num_retries: 0
    model_info:
      id: groq-oss120-free
      # Small practical free-tier envelope, NOT GPT-OSS's model context size.
      max_input_tokens: 3500

  # Auto-free complexity router (heuristic classifier; no paid calls).
  - model_name: auto-free
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: local
      complexity_router_config:
        classifier_type: heuristic
        adaptive: false
        tiers:
          SIMPLE: local
          MEDIUM: local
          COMPLEX: cloud-free
          REASONING: cloud-free
        session_affinity: false
        classification_mode: user_turn
        return_raw_model_name: false
        enable_context_window_escalation: false
        keyword_tier_rules:
          - keywords: ["distributed architecture", "system design", "refactor", "debug", "root cause", "optimize", "kubernetes", "security review"]
            tier: COMPLEX
          - keywords: ["step by step", "think through", "analyze deeply", "formal proof", "prove", "derive", "paxos", "raft"]
            tier: REASONING

litellm_settings:
  telemetry: false
  drop_params: false
  # RC/oMLX caveat: LiteLLM omits explicit stream:false downstream; this local
  # endpoint then ignores forced tools. See docs/local-tool-compatibility.md.
  modify_params: false
  num_retries: 0
  request_timeout: 600
  callbacks:
    - custom_callbacks.proxy_modifier

mcp_servers: {}
